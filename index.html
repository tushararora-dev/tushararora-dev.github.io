<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Portfolio of Tushar Arora, Full Stack AI Engineer building generative AI products with LLM agents, RAG, Angular and Node.js."

    <meta property="og:title" content="Tushar Arora | Full Stack AI Engineer" />

      property="og:description"
      content="Generative AI products end to end: multi-agent workflows, RAG and full stack web apps."
    />

    <meta name="theme-color" content="#004896" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('theme');
        // Dark is the default (terminal look); a saved choice wins
        var dark = t ? t === 'dark' : true;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
